      type: string
      description: Mirrors ProposalStatus in contracts/governance/src/lib.rs.
      enum:
      - Active
      - Passed
      - Rejected
      - Executed
      - Cancelled
    GovernanceProposal:
      type: object
      description: 'Mirrors the Proposal struct in contracts/governance/src/lib.rs.
        i128 fields are

        decimal strings so values beyond Number.MAX_SAFE_INTEGER keep full precision.

        '
      required:
      - id
      - proposer
      - paramKey
      - currentValue
      - proposedValue
      - votesFor
      - votesAgainst
      - status
      - createdAt
      - votingEndsAt
      - snapshottedTotalStaked
      properties:
        id:
          type: integer
          example: 1
        proposer:
          type: string
          description: Stellar address of the proposer
          example: GABCDEXAMPLE0000000000000000000000000000000000000000000000AB
        paramKey:
          type: string
          description: Arbitrary Soroban symbol chosen by the proposer; opaque to
            the contract and this API.
          example: min_stake
        currentValue:
          type: string
          description: i128 as a decimal string
          example: '100'
        proposedValue:
          type: string
          description: i128 as a decimal string
          example: '200'
        votesFor:
          type: string
          example: '600000'
        votesAgainst:
          type: string
          example: '200000'
        status:
          $ref: '#/components/schemas/GovernanceProposalStatus'
        createdAt:
          type: integer
          description: Ledger timestamp (unix seconds)
          example: 1735689600
        votingEndsAt:
          type: integer
          example: 1736294400
        snapshottedTotalStaked:
          type: string
          description: Total staked snapshotted at proposal creation, used for quorum
          example: '1000000'
    QuotaOverride:
      type: object
      required:
      - userId
      - elevatedLimit
      - reason
      - createdBy
      - createdAt
      properties:
        userId:
          type: string
          minLength: 1
        endpoint:
          type: string
          description: Omitted when the override applies to all endpoints
        elevatedLimit:
          type: integer
          minimum: 1
          maximum: 10000
        reason:
          type: string
          minLength: 1
          maxLength: 500
        createdBy:
          type: string
        createdAt:
          type: integer
          format: int64
          description: Unix epoch milliseconds when the override was created
        expiresAt:
          type: integer
          format: int64
          description: Optional Unix epoch milliseconds when the override expires
    AdminTransactionResult:
      type: object
      required:
      - success
      - txHash
      - message
      properties:
        success:
          type: boolean
          enum:
          - true
        txHash:
          type: string
          description: Stellar transaction hash from the direct call or multisig proposal
        message:
          type: string
    AdminMultisigProposalResult:
      allOf:
      - $ref: '#/components/schemas/AdminTransactionResult'
      - type: object
        required:
        - multisig
        properties:
          multisig:
            $ref: '#/components/schemas/MultisigGateResult'
    MultisigGateResult:
      type: object
      required:
      - proposalId
      - contractId
      - status
      - note
      properties:
        proposalId:
          type: integer
          nullable: true
          description: Proposal id, or null when the adapter did not return one
        contractId:
          type: string
          description: Id of the multisig contract that holds the proposal
        status:
          type: string
          enum:
          - pending
        note:
          type: string
          description: Signers must approve and one must execute the proposal before it takes effect
    AiRiskScoreResult:
      type: object
      required:
      - score
      - confidence
      - riskBand
      - contributingFactors
      - modelVersion
      properties:
        score:
          type: number
          minimum: 0
          maximum: 100
        confidence:
          type: number
          minimum: 0
          maximum: 1
        riskBand:
          type: string
          enum:
          - low
          - medium
          - high
          - very_high
        contributingFactors:
          type: array
          items:
            type: string
        modelVersion:
          type: string
    UnderwritingDecision:
      type: string
      enum:
      - APPROVE
      - REVIEW
      - REJECT
    UnderwritingRuleEvaluation:
      type: object
      required:
      - ruleId
      - ruleName
      - passed
      - score
      - weight
      - reason
      properties:
        ruleId:
          type: string
        ruleName:
          type: string
        passed:
          type: boolean
        score:
          type: number
        weight:
          type: number
        reason:
          type: string
        details:
          type: object
          additionalProperties: true
    UnderwritingResult:
      type: object
      required:
      - decision
      - totalScore
      - maxScore
      - triggeredRules
      - decisionReason
      - evaluatedAt
      properties:
        decision:
          $ref: '#/components/schemas/UnderwritingDecision'
        totalScore:
          type: number
        maxScore:
          type: number
        triggeredRules:
          type: array
          items:
            $ref: '#/components/schemas/UnderwritingRuleEvaluation'
        decisionReason:
          type: string
        evaluatedAt:
          type: string
          format: date-time
    UnderwritingRule:
      type: object
      required:
      - ruleId
      - ruleName
      - weight
      - enabled
      - severity
      properties:
        ruleId:
          type: string
          minLength: 1
        ruleName:
          type: string
          minLength: 1
        weight:
          type: integer
          minimum: 0
        enabled:
          type: boolean
        threshold:
          type: number
        severity:
          type: string
          enum:
          - critical
          - warning
          - info
    UnderwritingRuleConfig:
      type: object
      required:
      - version
      - rules
      - approveThreshold
      - reviewThreshold
      properties:
        version:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/UnderwritingRule'
        approveThreshold:
          type: number
          minimum: 0
          maximum: 100
        reviewThreshold:
          type: number
          minimum: 0
          maximum: 100
    UnderwritingRuleConfigUpdate:
      type: object
      description: Strict object. Unknown fields are rejected with 400.
      properties:
        version:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/UnderwritingRule'
        approveThreshold:
          type: number
          minimum: 0
          maximum: 100
        reviewThreshold:
          type: number
          minimum: 0
          maximum: 100
    UnderwritingDecisionTrace:
      type: object
      required:
      - id
      - applicationId
      - userId
      - decision
      - totalScore
      - maxScore
      - triggeredRules
      - decisionReason
      - ruleConfigVersion
      - evaluatedAt
      - createdAt
      properties:
        id:
          type: string
          description: Trace id, prefixed with `TRACE-` in the in-memory store
        applicationId:
          type: string
        userId:
          type: string
        decision:
          $ref: '#/components/schemas/UnderwritingDecision'
        totalScore:
          type: number
        maxScore:
          type: number
        triggeredRules:
          type: array
          items:
            $ref: '#/components/schemas/UnderwritingRuleEvaluation'
        decisionReason:
          type: string
        ruleConfigVersion:
          type: string
        aiRiskScore:
          $ref: '#/components/schemas/AiRiskScoreResult'
        evaluatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
  responses:
    NotImplemented:
      description: Operation unavailable in the current adapter or multisig configuration. Contract-access routes return NOT_IMPLEMENTED; circuit-breaker routes currently return INTERNAL_ERROR with HTTP 501.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Caller lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: Forbidden
    NotFound:
      description: Resource not found (also returned for resources owned by someone
        else)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Not found
    Conflict:
      description: Request conflicts with current state (duplicate submission or invalid
        status transition)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_STATE_TRANSITION
              message: Cannot bind a policy that is cancelled
    InspectionForbidden:
      description: Caller lacks the required permission, is not a verified inspector,
        or is not the assigned inspector
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: Only verified inspectors can perform this action
    InspectionNotFound:
      description: Inspection or listing not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Inspection not found
    InspectionInvalidTransition:
      description: The inspection's current status does not allow this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_STATE_TRANSITION
              message: Cannot submit an inspection with status 'pending'
              details:
                status: pending
    Error:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: TOO_MANY_REQUESTS
              message: Rate limit exceeded
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                fieldErrors:
                - field: email
                  message: Invalid email address
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: Ordinary authenticated-session bearer token (authenticateToken
        middleware only — no elevated role/permission required).
    bearerAdminAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: Same bearer token as bearerAuth, but the route additionally requires
        the caller's session to carry an admin-tier RBAC permission (requirePermission(resource,
        action) in middleware/rbac.ts, e.g. payouts:trigger) or an explicit admin/super_admin
        role check. Kept as a distinct scheme name so admin-gated operations are visibly
        distinguishable from ordinary authenticated ones in this document.
    adminSecret:
      type: apiKey
      in: header
      name: x-admin-secret
      description: Deprecated shared operator secret checked against MANUAL_ADMIN_SECRET.
        The admin routes no longer accept it unless ALLOW_LEGACY_ADMIN_SECRET=true
        is set (off by default); each use is logged as a warning. Use an admin bearer
        token with the route's permission.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: Provider-specific HMAC signature header verified server-side instead
        of a bearer token (e.g. x-paystack-signature for Paystack, verif-hash for
        Flutterwave). The header name varies by payment rail; see the payments webhook
        handler.
  /api/landlord/payout/preferences:
    patch:
      summary: Update landlord payout schedule preference
      operationId: updateLandlordPayoutPreference
      tags:
      - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - schedule
              properties:
                schedule:
                  type: string
                  enum:
                  - activation
                  - weekly
                  - monthly
      responses:
        '200':
          description: Payout preference updated
        '400':
          description: Invalid schedule preference
        '401':
          description: Authentication required



tags:
  - name: Health
    description: Health check operations
  - name: Soroban
    description: Soroban blockchain configuration
  - name: Auth
    description: Email/OTP authentication and sessions
  - name: Payments
    description: Payment confirmation and on-chain USDC receipt recording
  - name: Risk
    description: User risk state (frozen status)
  - name: Whistleblower
    description: Whistleblower listing operations
  - name: Vesting
    description: Authenticated vesting schedule operations
  - name: Epoch Rewards
    description: |
      Sealed, epoch-based staking rewards. Stakers stake, unstake and claim by signing in their own
      wallet; admins fund and seal epochs.
  - name: Multisig
    description: |
      M-of-N approval for privileged on-chain admin actions. When `MULTISIG_ADMIN_ID` is set, the
      circuit-breaker drain (`propose-drain`, `execute-drain`) and contract-access role assignment
      (`propose-assign-role`) admin endpoints file a proposal here and answer 202 with a `multisig`
      object instead of executing; `freeze` stays immediate. The drain endpoints then need a
      `drainHash` (64 hex characters), as the deal_escrow contract's drain functions take one.
  - name: Deals
    description: Deal management and repayment schedule operations
  - name: Admin
    description: Administrative operations including reward payouts
  - name: Wallet
    description: NGN wallet balance, ledger and withdrawals, and the custodial
      Stellar wallet
  - name: Deposits
    description: Fiat deposit confirmation and conversion
  - name: Staking
    description: Staking operations (stake, unstake, claim rewards)
  - name: Support
    description: Public support/contact message intake
  - name: Erasure
    description: Account erasure (NDPA/GDPR right-to-erasure) requests and admin review
  - name: Messaging
    description: Conversations, messages and message attachments (presigned
      uploads/downloads)
  - name: Inspections
    description: Property inspections (checklist + photos) feeding the listing trust
      score, and inspector verification
  - name: Landlord
    description: Partner landlord applications and landlord-facing operations
  - name: Rent Guarantee
    description: Landlord rent guarantee insurance - quotes, policy binding and claims
  - name: Governance
    description: Stake-weighted parameter governance proposals and voting
      (contracts/governance)
  - name: Tenant Rating
    description: Landlord ratings of tenants after a deal, and the tenant's portable
      rating card with expiring public share links (#1905)
  - name: Tenant Reputation
    description: >
      Computed on-chain tenant reputation scores derived from landlord ratings
      and payment history. Scores (0–100) are synced to the tenant_reputation
      Soroban contract via the outbox on every meaningful change (#1980).
  - name: Properties
    description: Public search, lookup and detail for approved properties (#1956)
  - name: Tenant
    description: Tenant-facing lease and payment operations
