  /api/admin/secrets/status:
    get:
      summary: Get the status of all managed secrets
      description: 'Returns the active version and valid-version count of every secret registered with the secret rotation service. Values are never returned.


        **Authentication:** the router mounts no authentication middleware, so this endpoint is reachable without a token (see the note on the secrets routes in the Admin tag).

        '
      operationId: getAdminSecretsStatus
      tags:
      - Admin
      security: []
      responses:
        '200':
          description: Status keyed by secret name
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/SecretStatus'
        '500':
          description: Secret service failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Internal server error
        default:
          $ref: '#/components/responses/Error'

  /api/admin/secrets/history:
    get:
      summary: Get the secret rotation history
      description: 'Returns the most recent rotation events, oldest first. The router performs no authentication (see the secrets routes note in the Admin tag).

        '
      operationId: getAdminSecretsHistory
      tags:
      - Admin
      security: []
      parameters:
      - name: limit
        in: query
        required: false
        description: Maximum number of events to return. Non-numeric or zero values fall back to 100.
        schema:
          type: integer
          default: 100
          minimum: 1
      responses:
        '200':
          description: Rotation events
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecretRotationEvent'
        '500':
          description: Secret service failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Internal server error
        default:
          $ref: '#/components/responses/Error'

  /api/admin/secrets/rotate:
    post:
      summary: Rotate a managed secret
      description: 'Installs a new value for a registered secret. The previous version stays valid for `gracePeriodMs` (the secret''s configured grace period applies when omitted). The new value must pass the secret''s validator.


        The router performs no authentication (see the secrets routes note in the Admin tag). The rotated value is accepted in the request body and is never echoed back.

        '
      operationId: rotateAdminSecret
      tags:
      - Admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - secretName
              - newValue
              properties:
                secretName:
                  type: string
                  description: Registered secret name, for example `webhook_secret`.
                  example: webhook_secret
                newValue:
                  type: string
                  description: New secret value. Must pass the validator registered for the secret.
                gracePeriodMs:
                  type: integer
                  minimum: 0
                  description: How long the previous version remains valid, in milliseconds.
      responses:
        '200':
          description: Secret rotated
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Secret webhook_secret rotated successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          description: Rotation failed, for example because the new value did not pass the validator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: 'Failed to rotate secret: webhook_secret'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/secrets/reload:
    post:
      summary: Reload secrets from the environment
      description: 'Forces the secret rotation service to re-read every registered secret from the environment. The router performs no authentication (see the secrets routes note in the Admin tag).

        '
      operationId: reloadAdminSecrets
      tags:
      - Admin
      security: []
      responses:
        '200':
          description: Secrets reloaded
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Secrets reloaded from environment
        '500':
          description: Secret service failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Internal server error
        default:
          $ref: '#/components/responses/Error'

