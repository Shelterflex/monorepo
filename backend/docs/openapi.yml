        in: path
        required: true
        description: Landlord user ID
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - verificationLevel
              - note
              properties:
                verificationLevel:
                  type: string
                  enum:
                  - unverified
                  - id_verified
                  - id_and_property_verified
                  - premium
                note:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Verification level set
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/wallets/rewrap:
    post:
      summary: Re-wrap custodial wallet keys
      description: 'Re-encrypts stored custodial wallet keys under a newer key version. Batch mode is not implemented for this wallet store, so `userId` must be supplied. Writes an audit entry (`WALLET_REWRAP`).'
      operationId: rewrapAdminWalletKeys
      tags:
      - Admin
      security:
      - bearerAdminAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fromKeyId:
                  type: string
                  description: Only re-wrap keys currently under this key ID
                toKeyId:
                  type: string
                  description: Target key ID. Defaults to the current encryption key.
                batchSize:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 100
                userId:
                  type: string
                  description: The user whose key to re-wrap
      responses:
        '200':
          description: Re-wrap result
          content:
            application/json:
              schema:
                type: object
                required:
                - fromKeyId
                - toKeyId
                - processed
                - updated
                - skipped
                - failures
                - hasMore
                properties:
                  fromKeyId:
                    type: string
                    example: any
                  toKeyId:
                    type: string
                  processed:
                    type: integer
                  updated:
                    type: integer
                  skipped:
                    type: integer
                  failures:
                    type: array
                    items:
                      type: object
                      required:
                      - userId
                      - reason
                      properties:
                        userId:
                          type: string
                        reason:
                          type: string
                  hasMore:
                    type: boolean
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'
        default:
          $ref: '#/components/responses/Error'

