          $ref: '#/components/responses/Error'
  /api/admin/circuit-breaker/propose-drain:
    post:
      summary: Propose a deal-escrow drain
      description: With a multisig configured, files a proposal for the multisig to call `propose_drain` and returns 202; `drainHash` is then required. Otherwise `proposeDrain(destination)` is called directly and returns 200. Requires a recently created session when authenticated by bearer token.
      operationId: proposeAdminCircuitBreakerDrain
      tags:
      - Admin
      security:
      - bearerAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - destination
              properties:
                destination:
                  type: string
                  description: Destination address for the drained funds
                drainHash:
                  type: string
                  pattern: '^[0-9a-fA-F]{64}$'
                  description: BytesN<32> hash as 64 hex characters; required when a multisig is configured
      responses:
        '200':
          description: Drain proposed directly without a multisig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTransactionResult'
        '202':
          description: Drain proposal filed with the multisig and not yet executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMultisigProposalResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'
        default:
          $ref: '#/components/responses/Error'
  /api/admin/circuit-breaker/execute-drain:
    post:
      summary: Execute a proposed deal-escrow drain
      description: With a multisig configured, files a proposal for the multisig to call `execute_drain` and returns 202; `drainHash` is then required. Otherwise `executeDrain()` is called directly and returns 200. Requires a recently created session when authenticated by bearer token.
      operationId: executeAdminCircuitBreakerDrain
      tags:
      - Admin
      security:
      - bearerAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                drainHash:
                  type: string
                  pattern: '^[0-9a-fA-F]{64}$'
                  description: BytesN<32> hash as 64 hex characters; required when a multisig is configured
      responses:
        '200':
          description: Drain executed directly without a multisig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTransactionResult'
        '202':
          description: Drain execution proposal filed with the multisig and not yet executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMultisigProposalResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'
        default:
          $ref: '#/components/responses/Error'
  /api/admin/circuit-breaker/set-recovery-delay:
    post:
      summary: Set the circuit-breaker recovery delay
      description: Sets the deal-escrow recovery delay in seconds. This operation is not multisig-gated and executes directly.
      operationId: setAdminCircuitBreakerRecoveryDelay
      tags:
      - Admin
      security:
      - bearerAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - delaySeconds
              properties:
                delaySeconds:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Recovery delay set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTransactionResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'
        default:
          $ref: '#/components/responses/Error'
  /api/admin/timelock/transactions:
    get:
      summary: List tracked timelock transactions
      description: Returns every governance transaction tracked by the timelock indexer, newest first.
      operationId: listAdminTimelockTransactions
      tags:
      - Admin
      security:
      - bearerAdminAuth: []
      responses:
        '200':
          description: Tracked timelock transactions
          content:
            application/json:
              schema:
                type: object
                required:
                - transactions
                properties:
                  transactions:
                    type: array
                    items:
                      type: object
                      required:
                      - txHash
                      - target
                      - functionName
                      - args
                      - eta
                      - status
                      - ledger
                      - createdAt
                      - updatedAt
                      properties:
                        txHash:
                          type: string
                        target:
                          type: string
                        functionName:
                          type: string
                        args:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                        eta:
                          type: integer
                          description: Unix epoch seconds at which the transaction becomes executable
                        status:
                          type: string
                          enum:
                          - queued
                          - executed
                          - cancelled
                        ledger:
                          type: integer
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/admin/timelock/cancel:
    post:
      summary: Cancel a queued timelock transaction
      description: Cancels a timelock transaction by its indexed hash. The route does not check the index before calling the adapter.
      operationId: cancelAdminTimelockTransaction
      tags:
      - Admin
      security:
      - bearerAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - txHash
              properties:
                txHash:
                  type: string
                  minLength: 1
                  description: Hash of the queued timelock transaction
      responses:
        '200':
          description: Transaction cancelled
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - stellarTxHash
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  stellarTxHash:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/admin/timelock/execute:
    post:
      summary: Execute a queued timelock transaction
      description: Looks up the transaction by hash, requires it to be `queued`, executes it through the Soroban adapter and returns the resulting Stellar transaction hash. Requires a recently created session when authenticated by bearer token.
      operationId: executeAdminTimelockTransaction
      tags:
      - Admin
      security:
      - bearerAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - txHash
              properties:
                txHash:
                  type: string
                  minLength: 1
                  description: Hash of the queued timelock transaction
      responses:
        '200':
          description: Transaction executed
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - stellarTxHash
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  stellarTxHash:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/tenant/lease/current:
