    TenantReputationScore:
      type: object
      description: 'Cached reputation record for one tenant, computed from landlord
        ratings

        and payment history. All scores are integers on a 0–100 scale. The

        on-chain contract stores them at 0–1000 (×10); the API surface uses

        0–100 for human readability. (#1980)

        '
      required:
      - id
      - tenantId
      - compositeScore
      - paymentScore
      - propertyCareScore
      - communicationScore
      - totalRatings
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        compositeScore:
          type: integer
          minimum: 0
          maximum: 100
          description: 'Weighted composite: payment × 0.50, propertyCare × 0.30, communication
            × 0.20.

            '
        paymentScore:
          type: integer
          minimum: 0
          maximum: 100
          description: 'On-time payment rate. 100 = all on time; 0 = all missed. Defaults
            to 50 when no scored payments exist.

            '
        propertyCareScore:
          type: integer
          minimum: 0
          maximum: 100
          description: 'Average landlord propertyCare rating (1–5) scaled ×20. Defaults
            to 50 when no ratings exist.

            '
        communicationScore:
          type: integer
          minimum: 0
          maximum: 100
          description: 'Average landlord communication rating (1–5) scaled ×20. Defaults
            to 50 when no ratings exist.

            '
        totalRatings:
          type: integer
          minimum: 0
          description: Number of landlord ratings received.
        updatedAt:
          type: string
          format: date-time
