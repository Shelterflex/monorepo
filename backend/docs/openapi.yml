        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/admin/underwriting/decisions:
    get:
      summary: List underwriting decision traces
      description: Lists decision traces newest first with optional decision filtering and offset pagination. The response echoes the parsed `limit` and `offset` values rather than the page-based `Pagination` component.
      operationId: listAdminUnderwritingDecisions
      tags:
      - Admin
      security:
      - bearerAdminAuth: []
      parameters:
      - name: decision
        in: query
        description: Decision filter; values outside the enum are ignored
        schema:
          type: string
          enum:
          - APPROVE
          - REVIEW
          - REJECT
      - name: limit
        in: query
        description: Page size parsed with parseInt; defaults to 50
        schema:
          type: integer
          minimum: 0
          default: 50
      - name: offset
        in: query
        description: Offset parsed with parseInt; defaults to 0
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: A page of underwriting decision traces
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - total
                - limit
                - offset
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnderwritingDecisionTrace'
                  total:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/admin/underwriting/decisions/{traceId}:
    get:
