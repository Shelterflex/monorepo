  /api/admin/transaction-ledger:
    get:
      summary: List the transaction ledger
      description: Paginates the platform transaction ledger, with filters and sorting. Results are keyset-paginated on `created_at`.
      operationId: listAdminTransactionLedger
      tags:
      - Admin
      security:
      - bearerAdminAuth: []
      parameters:
      - name: cursor
        in: query
        required: false
        description: Return rows created before this ISO timestamp (from `nextCursor`)
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: dateFrom
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: type
        in: query
        required: false
        description: Transaction type, for example `deposit`, `withdrawal`, `conversion`
        schema:
          type: string
      - name: currency
        in: query
        required: false
        schema:
          type: string
          example: NGN
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: actor
        in: query
        required: false
        description: Partial match on user ID or email
        schema:
          type: string
      - name: amountMin
        in: query
        required: false
        schema:
          type: string
          pattern: ^-?\d+$
          description: Minimum amount in minor units
      - name: amountMax
        in: query
        required: false
        schema:
          type: string
          pattern: ^-?\d+$
          description: Maximum amount in minor units
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          enum:
          - date
          - amount
          - status
          default: date
      - name: sortDir
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: Ledger page
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - count
                - hasNextPage
                - nextCursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionLedgerEntry'
                  count:
                    type: integer
                  hasNextPage:
                    type: boolean
                  nextCursor:
                    type: string
                    format: date-time
                    nullable: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'

