      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegateRequest'
      responses:
        '202':
          description: Undelegation requested; cooldown started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationTxResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/staking/delegation/undelegate/complete:
    post:
      summary: Complete a pending undelegation
      description: >-
        Settles a pending undelegation. The contract rejects this until its
        configured cooldown (7 days by default) has elapsed.
      operationId: completeUndelegate
      tags:
        - Staking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delegatee]
              properties:
                delegatee:
                  type: string
                  description: Delegatee whose pending undelegation should be settled
                  example: GBRPYHIL2CI3FNQ4BXLFMNDLFJUNPU2HY3ZMFSHONUCEOASW7QC7OX2H
      responses:
        '200':
          description: Undelegation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationTxResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/staking/delegation/commission:
