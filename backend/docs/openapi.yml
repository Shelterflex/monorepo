        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Active quota overrides
          content:
            application/json:
              schema:
                type: object
                required:
                - overrides
                properties:
                  overrides:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuotaOverride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/admin/quota/override:
    post:
      summary: Create a quota override
      description: Creates an elevated per-minute limit for a user and endpoint. The handler passes an `override` field to `res.json`, but `setOverride` returns void, so the serialized success body contains only `success`.
      operationId: createAdminQuotaOverride
      tags:
      - Admin
      security:
      - bearerAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - userId
              - elevatedLimit
              - reason
              properties:
                userId:
                  type: string
                  minLength: 1
                endpoint:
                  type: string
                  description: Endpoint key; omitted means all endpoints
                elevatedLimit:
                  type: integer
                  minimum: 1
                  maximum: 10000
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                expiresAt:
                  type: integer
                  format: int64
                  description: Optional Unix epoch milliseconds at which the override expires
      responses:
        '201':
          description: Override created. `override` is omitted from the actual response body.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove a quota override
      description: Removes the override for the given user and endpoint key; omitting `endpoint` removes the aggregate `all` override.
      operationId: removeAdminQuotaOverride
      tags:
      - Admin
      security:
      - bearerAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - userId
              properties:
                userId:
                  type: string
                  minLength: 1
                endpoint:
                  type: string
                  description: Endpoint key; omitted means all endpoints
      responses:
        '200':
          description: Override removed
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/admin/quota/stats:
    get:
      summary: Get aggregate quota statistics
      description: Returns the total and active override counts plus the near-limit user count. `nearLimitUsers` is currently always zero.
      operationId: getAdminQuotaStats
      tags:
      - Admin
      security:
      - bearerAdminAuth: []
