                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobRunHistory'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      description: Get job run history
  /api/admin/jobs/{id}/trigger:
    post:
      tags:
      - Admin
      summary: Trigger job execution immediately
      operationId: triggerJobImmediately
      security:
      - bearerAdminAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Job ID
      responses:
        '200':
          description: Job triggered successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - job
                properties:
                  job:
                    $ref: '#/components/schemas/ScheduledJob'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      description: Trigger job execution immediately
  /api/landlord/analytics:
    get:
      summary: Landlord analytics for occupancy, revenue, payments and vacancy
      description: 'Occupancy, expected and collected revenue, on-time, late and missed instalments, and vacancy metrics for the calling landlord''s own properties. Dates are YYYY-MM-DD in UTC, and both ends are inclusive. The window defaults to the last 12 months and may span at most 24. An empty portfolio returns zeroed arrays. A propertyId that is not one of the caller''s properties returns 404.'
      operationId: getLandlordAnalytics
      tags:
      - Landlord
      security:
      - bearerAuth: []
      parameters:
      - name: startDate
        in: query
        required: false
        schema:
          type: string
          format: date
          example: '2026-01-01'
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date
          example: '2026-12-31'
      - name: propertyId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Analytics for the window. The body is the bare object, not wrapped in an envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandlordAnalytics'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/landlord/payout-schedule:
    get:
      summary: Upcoming payouts, grouped by property and period
      description: 'Payouts that have not been paid yet (scheduled, processing, delayed or on hold), grouped by property and then by period, with a summary. Net is always gross minus fees. Landlords see only their own payouts.'
      operationId: getLandlordPayoutSchedule
      tags:
      - Landlord
      security:
      - bearerAuth: []
      parameters:
      - name: propertyId
        in: query
        required: false
        schema:
          type: string
      - name: grouping
        in: query
        required: false
        schema:
          type: string
          enum:
          - weekly
          - monthly
          default: monthly
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Upcoming payouts grouped by property and period
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      grouping:
                        type: string
                        enum:
                        - weekly
                        - monthly
                      properties:
                        type: array
                        items:
                          type: object
                          properties:
                            propertyId:
                              type: string
                            propertyName:
                              type: string
                            periods:
                              type: array
                              items:
                                $ref: '#/components/schemas/LandlordPayoutPeriod'
                      summary:
                        $ref: '#/components/schemas/LandlordPayoutSummary'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/landlord/payout-schedule/payouts:
    get:
      summary: Payout history
      description: Paginated payouts for the landlord, soonest scheduled first. Each payout shows its status, gross, fees and net.
      operationId: listLandlordPayouts
      tags:
      - Landlord
      security:
      - bearerAuth: []
      parameters:
      - name: propertyId
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/LandlordPayoutStatus'
      - name: channel
        in: query
        required: false
        schema:
          type: string
          enum:
          - bank_transfer
          - mobile_money
          - crypto_wallet
          - check
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: One page of payouts
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - pagination
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LandlordPayout'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/landlord/payout-schedule/preference:
    get:
      summary: Get payout frequency and destination
      operationId: getLandlordPayoutPreference
      tags:
      - Landlord
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current payout frequency and destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandlordPayoutPreferenceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Update payout frequency and destination
      description: 'Send schedulePreference, destination, or both. The destination is validated as a 10-digit account number, and the change is audited. Responses show only the last four digits of the account number.'
      operationId: updateLandlordPayoutPreference
      tags:
      - Landlord
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schedulePreference:
                  type: string
                  enum:
                  - activation
                  - weekly
                  - monthly
                destination:
                  type: object
                  required:
                  - bankName
                  - accountNumber
                  - accountName
                  properties:
                    bankName:
                      type: string
                      minLength: 2
                      maxLength: 100
                    accountNumber:
                      type: string
                      pattern: '^\d{10}$'
                    accountName:
                      type: string
                      minLength: 2
                      maxLength: 100
      responses:
        '200':
          description: Updated preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandlordPayoutPreferenceResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/landlord/payout-schedule/{payoutId}:
    get:
      summary: Get one payout
      description: Returns 404 for a payout that belongs to another landlord, the same as for one that does not exist.
      operationId: getLandlordPayout
      tags:
      - Landlord
      security:
      - bearerAuth: []
      parameters:
      - name: payoutId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The payout
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/LandlordPayout'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/support/messages:
    post:
      summary: Submit a contact-form message
      description: 'Public contact-form submission, with no authentication. Each IP may submit five messages per hour, and the sixth returns 429. Fields are plain text, and HTML tags are rejected.'
      operationId: submitSupportMessage
      tags:
      - Support
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - subject
              - message
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 254
                phone:
                  type: string
                  nullable: true
                  maxLength: 20
                subject:
                  type: string
                  minLength: 1
                  maxLength: 255
                message:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        '201':
          description: Message stored
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - messageId
                properties:
                  success:
                    type: boolean
                    example: true
                  messageId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /api/admin/support/messages:
    get:
      summary: List support messages
      description: Paginated, newest first, with an optional status filter. Requires the support:view permission.
      operationId: listSupportMessages
      tags:
      - Support
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - new
          - in_progress
          - resolved
      responses:
        '200':
          description: One page of support messages
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - pagination
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        messageId:
                          type: string
                          format: uuid
                        name:
                          type: string
                        email:
                          type: string
                        phone:
                          type: string
                          nullable: true
                        subject:
                          type: string
                        message:
                          type: string
                        status:
                          type: string
                          enum:
                          - new
                          - in_progress
                          - resolved
                        ip:
                          type: string
                          nullable: true
                        userAgent:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/apartment-reviews:
    get:
      summary: List visible apartment reviews
      description: Public and paginated. Hidden reviews are left out of the list and of averageRating. Reviewer ids are not returned.
      operationId: listApartmentReviews
      tags:
      - Properties
      parameters:
      - name: listingId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - recent
          - rating_desc
          - rating_asc
          default: recent
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: One page of visible reviews
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      reviews:
                        type: array
                        items:
                          type: object
                      total:
                        type: integer
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      totalPages:
                        type: integer
                      averageRating:
                        type: number
                        nullable: true
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Review a listing
      description: Authenticated. The caller must have a deal or a live application for the listing. The rating is 1 to 5, the text is plain text up to 2000 characters, and each user may review a listing once.
      operationId: createApartmentReview
      tags:
      - Properties
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - listingId
              - rating
              - text
              properties:
                listingId:
                  type: string
                  format: uuid
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                text:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Review created
        '400':
          description: Validation failed (for example, HTML in the text)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
        '403':
          description: The caller has no deal or application for this listing
        '409':
          description: The caller has already reviewed this listing
  /api/apartment-reviews/{id}/report:
    post:
      summary: Report an apartment review
      description: Authenticated. Each user counts once per review. A review that reaches the report threshold is hidden until a moderator decides otherwise.
      operationId: reportApartmentReview
      tags:
      - Properties
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Report recorded (alreadyReported is true for a repeat report)
        '401':
          description: Authentication required
        '403':
          description: A user cannot report their own review
        '404':
          description: Review not found
  /api/admin/apartment-reviews/{id}:
    patch:
      summary: Hide or unhide an apartment review
      description: Moderator action. Requires the listings:moderate permission. The decision is audited.
      operationId: moderateApartmentReview
      tags:
      - Admin
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - isHidden
              properties:
                isHidden:
                  type: boolean
      responses:
        '200':
          description: Moderation decision applied
        '400':
          description: Validation failed
        '401':
          description: Authentication required
        '403':
          description: Missing listings:moderate permission
        '404':
          description: Review not found
  /api/tenant/data-export:
    post:
      summary: Request a personal-data export
      description: Queues an export of the caller's profile, applications, deals and payment schedules. The archive is built by a scheduled job, stays available for 7 days, and is removed afterwards. At most one export can be active at a time, and at most 3 can be requested in 24 hours.
      operationId: requestTenantDataExport
      tags:
      - Tenant
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Export queued
        '401':
          description: Authentication required
        '409':
          description: An export is already in progress
        '429':
          description: Daily export limit reached
  /api/tenant/data-export/{id}:
    get:
      summary: Get the status of a personal-data export
      description: Returns the export's status. The downloadUrl is included only while the archive is ready, and it expires after 5 minutes. Another user's export id returns 404.
      operationId: getTenantDataExport
      tags:
      - Tenant
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Export status
        '401':
          description: Authentication required
        '404':
          description: Export not found
  /api/tenant/erasure:
    get:
      summary: Get the latest account erasure request
      operationId: getAccountErasure
      tags:
      - Erasure
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The latest request, or null when there has never been one
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    nullable: true
                    allOf:
                    - $ref: '#/components/schemas/ErasureRequest'
        '401':
          description: Authentication required
    post:
      summary: Request account erasure
      description: Starts the erasure flow. Refused with 409 while the account has an active or at-risk deal, a pending, approved or processing withdrawal, a non-zero NGN balance, or an open dispute. The response lists the blockers.
      operationId: requestAccountErasure
      tags:
      - Erasure
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Request created and pending confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureRequestEnvelope'
        '401':
          description: Authentication required
        '409':
          description: Blocked, or a request is already open
    delete:
      summary: Cancel the open account erasure request
      description: Allowed while the request is pending, or while it is scheduled and before its grace window ends.
      operationId: cancelAccountErasure
      tags:
      - Erasure
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Request cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureRequestEnvelope'
        '401':
          description: Authentication required
        '404':
          description: No open request
        '409':
          description: The grace period has ended
  /api/tenant/erasure/{id}/confirm:
    post:
      summary: Confirm a pending account erasure request
      description: Confirms the request within 30 days of creating it. Blockers are checked again. On success the request is scheduled with a 14-day grace window, after which the account is anonymized and its sessions are revoked.
      operationId: confirmAccountErasure
      tags:
      - Erasure
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Request scheduled for erasure after the grace window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureRequestEnvelope'
        '401':
          description: Authentication required
        '404':
          description: Request not found
        '409':
          description: Not pending, the confirmation window has passed, or blockers apply
  /api/tenant/saved-properties:
    get:
      summary: List the caller's saved listings
      description: Saved listing ids for the authenticated tenant, most recently saved first. Paginated. A tenant only ever sees their own list.
      operationId: listSavedProperties
      tags:
      - Tenant
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: One page of saved listing ids
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - pagination
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: string
                      format: uuid
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /api/tenant/saved-properties/{listingId}:
    put:
      summary: Save a listing
      description: 'Saves an approved (publicly visible) listing for the caller. Saving a listing twice keeps one entry and returns 200 both times. Unknown or non-public listings return 404.'
      operationId: saveProperty
      tags:
      - Tenant
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/SavedPropertyListingId'
      responses:
        '200':
          description: Listing saved (or already saved)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedPropertyToggleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove a saved listing
      description: Removes a listing from the caller's saved list. Idempotent, and it works even if the listing has since been rejected or rented.
      operationId: unsaveProperty
      tags:
      - Tenant
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/SavedPropertyListingId'
      responses:
        '200':
          description: Listing removed (or was not saved)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedPropertyToggleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /api/admin/quota/usage/{userId}:
    get:
      summary: Get quota usage for a user
      description: Returns current minute and day counters, effective limits, reset timestamps and the near-limit flag. The endpoint query selects a single endpoint key; `all` is used when it is omitted.
      operationId: getAdminQuotaUsage
      tags:
      - Admin
      security:
      - bearerAdminAuth: []
      parameters:
      - name: userId
        in: path
        required: true
        description: User id whose quota is inspected
        schema:
          type: string
          minLength: 1
      - name: endpoint
        in: query
        description: Endpoint key, or omitted for the aggregate `all` bucket
        schema:
          type: string
      responses:
        '200':
          description: Current quota usage
          content:
            application/json:
              schema:
                type: object
                required:
                - userId
                - endpoint
                - minuteUsage
                - dayUsage
                - minuteLimit
                - dayLimit
                - minuteReset
                - dayReset
                - nearLimit
                properties:
                  userId:
                    type: string
                  endpoint:
                    type: string
                    description: Echoes the requested endpoint, or `all` when none was supplied
                  minuteUsage:
                    type: integer
                    minimum: 0
                  dayUsage:
                    type: integer
                    minimum: 0
                  minuteLimit:
                    type: integer
                    minimum: 0
