                      $ref: '#/components/schemas/UnderwritingDecisionTrace'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/admin/underwriting/evaluate/{applicationId}:
    post:
      summary: Re-run underwriting evaluation for an application
      description: Runs the underwriting pipeline again, records a new decision trace and returns the evaluation result. A missing application currently surfaces as an unhandled 500 rather than a 404.
      operationId: evaluateAdminUnderwritingApplication
      tags:
      - Admin
      security:
      - bearerAdminAuth: []
      parameters:
      - name: applicationId
        in: path
        required: true
        description: Tenant application id to evaluate
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Strict object; unknown fields are rejected
              properties:
                paymentHistory:
                  type: object
                  required:
                  - onTimePaymentRate
                  - missedPayments
                  - totalPayments
                  properties:
                    onTimePaymentRate:
                      type: number
                      minimum: 0
                      maximum: 1
                      description: Rate between 0 and 1
                    missedPayments:
                      type: integer
                      minimum: 0
                    totalPayments:
                      type: integer
                      minimum: 0
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Evaluation result
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    required:
                    - applicationId
                    - userId
                    - decision
                    - result
                    - evaluatedAt
                    properties:
                      applicationId:
                        type: string
                      userId:
                        type: string
                      decision:
                        $ref: '#/components/schemas/UnderwritingDecision'
                      result:
                        $ref: '#/components/schemas/UnderwritingResult'
                      creditScore:
                        type: object
                        description: Present when onboarding verification data is available
                        required:
                        - id
                        - tenantId
                        - score
                        - band
                        - incomeScore
                        - employmentScore
                        - bankStatementScore
                        - alternativeDataScore
                        - computedAt
                        - version
                        - dataVersion
                        properties:
                          id:
                            type: string
                          tenantId:
                            type: string
                          score:
                            type: integer
                            minimum: 0
                            maximum: 1000
                          band:
                            type: string
                            enum:
                            - A
                            - B
                            - C
                            - D
                            - F
                          incomeScore:
                            type: number
                          employmentScore:
                            type: number
                          bankStatementScore:
                            type: number
                          alternativeDataScore:
                            type: number
                            nullable: true
                          computedAt:
                            type: string
                            format: date-time
                          version:
                            type: string
                          dataVersion:
                            type: string
                      creditBandDecision:
                        type: string
                        enum:
                        - approve
                        - manual_review
                        - reject
                      externalCreditScore:
                        type: number
                        description: Declared by the service output type but not populated by the current evaluator
                      aiRiskScore:
                        $ref: '#/components/schemas/AiRiskScoreResult'
                      evaluatedAt:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/admin/contract-access/permission:
    get:
      summary: Check a contract-access permission
      description: Checks whether an address holds a numeric permission in the contract_access contract. The current query schema validates the raw string with `z.number()`, so a numeric query value is rejected with 400 and no value can currently pass validation.
      operationId: getAdminContractAccessPermission
      tags:
      - Admin
      security:
      - bearerAdminAuth: []
      parameters:
      - name: address
        in: query
        required: true
        description: Stellar address to check
        schema:
          type: string
      - name: permission
        in: query
        required: true
        description: Permission number; currently impossible to supply in a way that passes the uncoerced query validation
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Permission check result
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - address
                - permission
                - hasPermission
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  address:
                    type: string
                  permission:
                    type: integer
                    minimum: 0
                  hasPermission:
                    type: boolean
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'
        default:
          $ref: '#/components/responses/Error'
