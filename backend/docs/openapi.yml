  /api/v1/governance/proposals/prepare:
    post:
      summary: Prepare an unsigned create_proposal transaction
      description: 'Builds an unsigned Soroban transaction envelope for `create_proposal`,
        sourced

        from the caller''s linked Stellar address. The contract calls `proposer.require_auth()`,

        so this backend cannot sign on the caller''s behalf — the connected wallet
        must sign

        the returned XDR and post it to `/api/v1/governance/proposals/submit`.


        Rejects with 403 if the caller''s staked balance is below MIN_STAKE_TO_PROPOSE.
        This is

        an informational pre-check against the real staking_pool balance; the authoritative

        gate remains the governance contract''s own on-chain check.

        '
      operationId: prepareGovernanceProposal
      tags:
      - Governance
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareGovernanceProposalRequest'
      responses:
        '200':
          description: Unsigned transaction ready for the caller's wallet to sign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsignedTransactionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Staked balance is below MIN_STAKE_TO_PROPOSE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/governance/proposals/submit:
    post:
      summary: Submit a wallet-signed create_proposal transaction
      operationId: submitGovernanceProposal
      tags:
      - Governance
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSignedTransactionRequest'
      responses:
        '200':
          description: Transaction broadcast and confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceTxResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
      description: Submit a wallet-signed create_proposal transaction
  /api/v1/governance/proposals/{id}/execute:
    post:
      summary: Execute a passed proposal after its timelock elapses
      description: '`execute_proposal` is permissionless on-chain and has no direct
        on-chain effect

        beyond flipping the proposal''s status and emitting `proposal_executed` —
        applying

        `proposedValue` to whatever `paramKey` represents is an off-chain/other-contract

        action driven by that event.

        '
      operationId: executeGovernanceProposal
      tags:
      - Governance
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/GovernanceProposalId'
      responses:
        '200':
          description: Proposal executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceTxResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/governance/proposals/{id}/finalize:
    post:
      summary: Finalize a proposal after its voting period ends
      description: '`finalize_proposal` is permissionless on-chain (no require_auth)
        — any authenticated

        caller may trigger it once the voting period has elapsed; the backend''s operational

        key only pays the fee.

        '
      operationId: finalizeGovernanceProposal
      tags:
      - Governance
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/GovernanceProposalId'
      responses:
        '200':
          description: Proposal finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceTxResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/governance/proposals/{id}/vote/prepare:
    post:
      summary: Prepare an unsigned vote transaction
      description: 'Builds an unsigned `vote` transaction sourced from the caller''s
        linked Stellar

        address. Vote weight is the voter''s stake, snapshotted on-chain at the moment
        of

        their first vote on this proposal — this backend performs no weight calculation.

        '
      operationId: prepareGovernanceVote
      tags:
      - Governance
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/GovernanceProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceVoteRequest'
      responses:
        '200':
          description: Unsigned transaction ready for the caller's wallet to sign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsignedTransactionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/governance/proposals/{id}/vote/submit:
    post:
      summary: Submit a wallet-signed vote transaction
      operationId: submitGovernanceVote
      tags:
      - Governance
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/GovernanceProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSignedTransactionRequest'
      responses:
        '200':
          description: Vote transaction broadcast and confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceTxResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
      description: Submit a wallet-signed vote transaction
